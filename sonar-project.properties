# SonarQube Local Project Configuration

# Unique project identifier
sonar.projectKey=my-local-app

# SonarQube server URL (Default for local docker)
sonar.host.url=http://localhost:9000

# Source directories to scan
sonar.sources=sample-app

# Exclude test files from being analyzed as application code
sonar.exclusions=**/*.test.js

# Programming language
sonar.language=js

# Encoding of the source code
sonar.sourceEncoding=UTF-8
